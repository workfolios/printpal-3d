name: Apply Slice Eight Source

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'phase3d/slice-8-export-import-data-controls'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout controlled feature branch
        uses: actions/checkout@v4
        with:
          ref: phase3d/slice-8-export-import-data-controls
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct exact Slice Eight source
        shell: bash
        run: |
          set -euo pipefail
          cat .slice8/payload.part-* > /tmp/slice8-payload.b64
          base64 --decode /tmp/slice8-payload.b64 > /tmp/slice8-payload.tar.gz
          tar -xzf /tmp/slice8-payload.tar.gz -C .
          rm -rf .slice8
          rm -f .github/workflows/apply-slice8-source.yml

      - name: Validate reconstructed source
        run: |
          npm install --no-audit --no-fund
          npm run check

      - name: Commit controlled Slice Eight source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "workfolios"
          git config user.email "workfolios@users.noreply.github.com"
          git add -A
          git commit -m "feat(data): implement Slice Eight export import and recovery controls"
          git push origin HEAD:phase3d/slice-8-export-import-data-controls
