name: PrintPal Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate types, tests, and production build
        shell: bash
        run: |
          set +e
          npm run check > validation.log 2>&1
          status=$?
          cat validation.log
          exit $status
      - name: Validate desktop and mobile record workflow
        shell: bash
        env:
          CI: true
        run: |
          set +e
          npm run test:e2e > e2e.log 2>&1
          status=$?
          cat e2e.log
          exit $status
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: printpal-validation-logs
          path: |
            validation.log
            e2e.log
            playwright-report/
            test-results/
          if-no-files-found: warn
