name: Apply Slice Seven Source

on:
  push:
    branches:
      - phase3d/slice-7-ai-interpretation-next-test
    paths:
      - .github/workflows/apply-slice7-source.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: phase3d/slice-7-ai-interpretation-next-test
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct exact Slice Seven source
        shell: bash
        run: |
          set -euo pipefail
          cat .slice7/source/comparisonService.part-* > src/services/comparisonService.ts
          if ! grep -q "## Slice Seven — AI Interpretation And Next-Test Planning" docs/requirements-traceability.md; then
            cat .slice7/source/requirements-traceability-append.md >> docs/requirements-traceability.md
          fi
          rm -rf .slice7
          rm -f .github/workflows/apply-slice7-source.yml

      - name: Validate reconstructed source
        run: |
          npm install
          npm run check

      - name: Commit exact Slice Seven source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "workfolios"
          git config user.email "workfolios@users.noreply.github.com"
          git add -A
          git commit -m "feat(decision-support): complete Slice Seven implementation"
          git push origin HEAD:phase3d/slice-7-ai-interpretation-next-test
