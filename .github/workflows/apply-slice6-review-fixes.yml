name: Apply Slice Six Review Fixes

on:
  push:
    branches:
      - phase3d/slice-6-deterministic-comparison
    paths:
      - .github/workflows/apply-slice6-review-fixes.yml
      - .slice6fix/payload.part-*

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Slice Six branch
        uses: actions/checkout@v4
        with:
          ref: phase3d/slice-6-deterministic-comparison
          fetch-depth: 0
      - name: Reassemble and verify governed review fixes
        shell: bash
        run: |
          cat .slice6fix/payload.part-* | base64 --decode > /tmp/slice6-review-fixes.tar.gz
          echo "39299721b8ce65ba7584d54786abf86d66b64298e1985c50e3db8e91eeea2796  /tmp/slice6-review-fixes.tar.gz" | sha256sum --check --strict
      - name: Apply reviewed source changes
        shell: bash
        run: |
          tar -xzf /tmp/slice6-review-fixes.tar.gz
          git status --short
      - name: Commit reviewed source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/comparisonService.ts src/services/__tests__/comparisonService.test.ts
          git commit -m "fix(comparison): preserve pair-specific planned-change evidence"
          git push origin HEAD:phase3d/slice-6-deterministic-comparison
