name: Fix Slice Eight Validation

on:
  push:
    branches:
      - phase3d/slice-8-export-import-data-controls
    paths:
      - .github/workflows/fix-slice8-validation.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Slice Eight branch
        uses: actions/checkout@v4
        with:
          ref: phase3d/slice-8-export-import-data-controls
          fetch-depth: 0

      - name: Correct interpretation button busy-state guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/screens/DecisionSupportScreen.tsx')
          source = path.read_text()
          old = 'disabled={!interpretationBusy || !record.isCurrent}'
          new = 'disabled={interpretationBusy || !record.isCurrent}'
          if old not in source:
              raise SystemExit('Expected Slice Seven button guard was not found.')
          path.write_text(source.replace(old, new, 1))
          PY
          rm -f .github/workflows/fix-slice8-validation.yml

      - name: Validate targeted source correction
        run: |
          npm install
          npm run check

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "workfolios"
          git config user.email "workfolios@users.noreply.github.com"
          git add -A
          git commit -m "fix(decision-support): enable interpretation generation when idle"
          git push origin HEAD:phase3d/slice-8-export-import-data-controls
