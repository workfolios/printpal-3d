name: Fix Slice Eight Browser Regression

on:
  push:
    branches:
      - phase3d/slice-8-export-import-data-controls
    paths:
      - .github/workflows/fix-slice8-browser-regression.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Slice Eight branch
        uses: actions/checkout@v4
        with:
          ref: phase3d/slice-8-export-import-data-controls
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Correct reload navigation in decision-support acceptance test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('e2e/decision-support.spec.ts')
          source = path.read_text()
          old = '''  await page.reload();
  await expect(primaryVariable).toHaveValue("Orientation only");
  await expect(page.getByText("ACCEPTED")).toBeVisible();
  await expect(page.getByText(/User-refined interpretation/)).toBeVisible();
'''
          new = '''  await page.reload();
  await expect(page.getByRole("heading", { name: "Record Library" })).toBeVisible();
  await page.getByRole("button", { name: "Open Record" }).click();
  await expect(page.getByText(/Attempt 2/).first()).toBeVisible();

  const reloadedComparison = page.getByRole("button", {
    name: /open comparison|view comparison|comparison record/i,
  });
  await expect(reloadedComparison.first()).toBeVisible();
  await reloadedComparison.first().click();
  await expect(page.getByRole("heading", { name: "Deterministic Comparison" })).toBeVisible();
  await page.getByRole("button", { name: "Interpret And Plan" }).click();
  await expect(page.getByRole("heading", { name: "Interpret & Plan The Next Test" })).toBeVisible();

  const reloadedPrimaryVariable = page
    .locator("label")
    .filter({ hasText: "Primary Variable" })
    .locator("input");
  await expect(reloadedPrimaryVariable).toHaveValue("Orientation only");
  await expect(page.getByText("ACCEPTED")).toBeVisible();
  await expect(page.getByText(/User-refined interpretation/)).toBeVisible();
'''
          if old not in source:
              raise SystemExit('Expected reload assertion block was not found.')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Remove temporary correction workflow
        run: rm -f .github/workflows/fix-slice8-browser-regression.yml

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate application and browser regression gate
        run: |
          npm run check
          npx playwright test e2e/decision-support.spec.ts

      - name: Commit accepted correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "workfolios"
          git config user.email "workfolios@users.noreply.github.com"
          git add -A
          git commit -m "test(e2e): reopen decision support after reload"
          git push origin HEAD:phase3d/slice-8-export-import-data-controls
