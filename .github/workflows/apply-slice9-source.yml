name: Apply Slice Nine Source

on:
  push:
    branches:
      - phase3d/slice-9-integrated-ux-regression
    paths:
      - .github/workflows/apply-slice9-source.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: phase3d/slice-9-integrated-ux-regression
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct exact Slice Nine source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          staging = Path('.slice9')
          for part_number in ('008', '009', '010', '011', '012'):
              chunks = sorted(staging.glob(f'payload.part-{part_number}.hex-*'))
              if not chunks:
                  raise SystemExit(f'Missing hexadecimal chunks for part {part_number}.')
              encoded_hex = ''.join(chunk.read_text(encoding='utf-8').strip() for chunk in chunks)
              (staging / f'payload.part-{part_number}').write_bytes(bytes.fromhex(encoded_hex))
          PY
          cat .slice9/payload.part-[0-9][0-9][0-9] | base64 --decode > /tmp/slice9-payload.zip
          unzip -oq /tmp/slice9-payload.zip -d .
          while IFS= read -r path; do
            if [ -n "$path" ]; then rm -f -- "$path"; fi
          done < .slice9-delete-manifest.txt
          rm -f .slice9-delete-manifest.txt
          rm -rf .slice9
          rm -f .github/workflows/apply-slice9-source.yml

      - name: Validate reconstructed source
        run: |
          npm install --no-audit --no-fund
          npm run check

      - name: Commit exact Slice Nine source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "workfolios"
          git config user.email "workfolios@users.noreply.github.com"
          git add -A
          git commit -m "feat(ux): complete Slice Nine integrated regression"
          git push origin HEAD:phase3d/slice-9-integrated-ux-regression
