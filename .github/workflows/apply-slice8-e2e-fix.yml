name: Apply Slice Eight E2E Navigation Fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'phase3d/slice-8-export-import-data-controls'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout controlled feature branch
        uses: actions/checkout@v4
        with:
          ref: phase3d/slice-8-export-import-data-controls
          fetch-depth: 0

      - name: Apply focused Playwright navigation correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('e2e/decision-support.spec.ts')
          text = path.read_text()
          old = 'await page.getByText("Slice Seven Decision Support", { exact: true }).first().click();'
          new = 'await page.getByRole("button", { name: "Open Record" }).click();'
          if old not in text:
              raise SystemExit('Expected navigation assertion was not found.')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/apply-slice8-e2e-fix.yml

      - name: Commit focused correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "workfolios"
          git config user.email "workfolios@users.noreply.github.com"
          git add -A
          git commit -m "test(slice8): open seeded decision-support record explicitly"
          git push origin HEAD:phase3d/slice-8-export-import-data-controls
