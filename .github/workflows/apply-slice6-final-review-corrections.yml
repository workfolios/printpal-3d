name: Apply Slice Six Final Review Corrections

on:
  push:
    branches:
      - phase3d/slice-6-deterministic-comparison
    paths:
      - .github/workflows/apply-slice6-final-review-corrections.yml
      - .slice6review2/payload.part-*

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Slice Six branch
        uses: actions/checkout@v4
        with:
          ref: phase3d/slice-6-deterministic-comparison
          fetch-depth: 0
      - name: Reassemble and verify governed review corrections
        shell: bash
        run: |
          cat .slice6review2/payload.part-* | base64 --decode > /tmp/slice6-review-corrections.tar.gz
          echo "7aabc34b9a5d8b8c5c377da32259d4b800894f621b3602cc92a910c94f151b48  /tmp/slice6-review-corrections.tar.gz" | sha256sum --check --strict
      - name: Apply reviewed source changes
        shell: bash
        run: |
          tar -xzf /tmp/slice6-review-corrections.tar.gz
          git status --short
      - name: Commit reviewed source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/comparisonService.ts src/services/__tests__/comparisonService.test.ts
          git commit -m "fix(comparison): refresh stale pairs and preserve lineage evidence"
          git push origin HEAD:phase3d/slice-6-deterministic-comparison
